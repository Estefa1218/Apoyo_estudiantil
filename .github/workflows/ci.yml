name: Suite de Pruebas QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'
        cache-dependency-path: frontend/package.json

    - name: Instalar dependencias del Frontend
      run: |
        cd frontend
        npm install

    - name: Ejecutar Pruebas Unitarias e Integración (con Coverage)
      run: |
        cd frontend
        npm run test -- --coverage

    - name: Instalar Navegadores de Playwright
      run: |
        cd frontend
        npx playwright install --with-deps

    - name: Ejecutar Pruebas End-to-End (E2E)
      run: |
        cd frontend
        npx playwright test